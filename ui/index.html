<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lovelace</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>

<body>
    <header class="app-header">
        <button type="button" class="brand" data-view-target="dashboard" aria-label="Lovelace dashboard">
            <svg class="brand-mark" width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
                <rect x="2" y="2" width="96" height="96" rx="21" fill="#780000" />
                <g fill="#fdf0d5">
                    <ellipse cx="35.5" cy="35.5" rx="11.5" ry="12.5" />
                    <path
                        d="M23 77 C28 70 36 69 43 64 C46 61 44 57 40 52 C34 46 32 39 34 32 C36 21 46 16 56 18 C65 19 70 26 70 35 C69 38 71 41 75 45 C77 47 75 49 71 49 C70 50 70 52 71 54 C71 55 69 56 68 56 C69 59 67 62 63 62 C58 61 55 62 55 66 C56 71 66 73 74 76 C76 77 77 79 75 81 L25 81 C23 80 22 79 23 77 Z" />
                </g>
                <g fill="#780000">
                    <rect x="37.05" y="37.5" width="3.9" height="5" rx="1.95" />
                    <rect x="43.05" y="33.5" width="3.9" height="9" rx="1.95" />
                    <rect x="49.05" y="28" width="3.9" height="16" rx="1.95" />
                    <rect x="55.05" y="28.5" width="3.9" height="11" rx="1.95" />
                    <rect x="61.05" y="29.5" width="3.9" height="5" rx="1.95" />
                </g>
            </svg>
            Lovelace
        </button>
        <button type="button" id="back" class="back" data-view-target="dashboard" hidden>
            <span aria-hidden="true">←</span> Back to dashboard
        </button>
        <button type="button" id="active-job" class="job-status" data-view-target="record" hidden></button>
    </header>

    <main class="workspace" data-view="dashboard">
        <p id="message" class="message" role="status" hidden></p>

        <section class="studio" aria-labelledby="studio-heading">
            <div class="studio-intro">
                <h1 id="studio-heading" tabindex="-1">Recording<br> studio</h1>
                <button type="button" class="studio-link" data-view-target="record">
                    Open recorder <span aria-hidden="true">↗</span>
                </button>
            </div>
            <div class="toolbar" aria-label="Recorder">
                <div class="record-status">
                    <span class="status-dot" aria-hidden="true"></span>
                </div>
                <time id="elapsed" aria-label="Recording time">00:00</time>
                <div class="signal">
                    <span id="signal-label">Microphone level</span>
                    <meter id="level" class="visually-hidden" min="0" max="1" value="0"
                        aria-labelledby="signal-label"></meter>
                    <canvas id="signal-chart" width="720" height="96" aria-hidden="true"></canvas>
                </div>
                <div class="record-controls">
                    <div class="language-control">
                        <label for="language">Spoken language</label>
                        <select id="language">
                            <option value="pt">Portuguese</option>
                            <option value="en">English</option>
                            <option value="auto">Auto-detect</option>
                        </select>
                    </div>
                    <button type="button" id="record" class="primary"><span aria-hidden="true"></span><b
                            id="record-label">Record</b></button>
                </div>
            </div>
        </section>

        <section class="history-panel panel" aria-labelledby="history-heading">
            <header class="panel-header">
                <h2 id="history-heading" tabindex="-1">History</h2>
                <button type="button" class="panel-link" data-view-target="history" aria-label="Open history">
                    <span aria-hidden="true">↗</span>
                </button>
            </header>
            <div class="history-total">
                <span id="session-count">0</span>
                <span id="session-count-label">sessions</span>
            </div>
            <nav id="history" aria-labelledby="history-heading"></nav>
        </section>

        <section class="documents-panel panel" aria-label="Session documents">
            <button type="button" class="document-preview" data-view-target="documents">
                <span class="panel-kicker">Documents</span>
                <span class="panel-link" aria-hidden="true">↗</span>
                <span id="preview-title" class="preview-title">Summary and transcript</span>
                <span id="preview-detail" class="preview-detail">Your recording documents will appear here.</span>
            </button>

            <div id="review" class="review" hidden>
                <div class="review-header">
                    <div class="review-heading">
                        <div>
                            <span id="session-state" class="panel-kicker"></span>
                            <h2 id="session-title" tabindex="-1"></h2>
                        </div>
                        <button type="button" id="retry" class="secondary" hidden>Process session</button>
                    </div>
                    <div class="document-toolbar">
                        <div class="document-picker" role="group" aria-label="Document">
                            <button type="button" data-document="summary" aria-pressed="true">Summary</button>
                            <button type="button" data-document="transcript" aria-pressed="false">Transcript</button>
                        </div>
                        <button type="button" id="copy" class="secondary">Copy Markdown</button>
                    </div>
                </div>
                <div id="reading-pane" class="reading-pane">
                    <article id="document" class="document"></article>
                </div>
            </div>

            <div id="empty" class="empty">
                <h2 id="empty-title" tabindex="-1">Your first recording</h2>
                <p id="empty-description">The transcript and summary will appear here after processing.</p>
                <button type="button" class="secondary" data-view-target="record">Open recorder</button>
            </div>
        </section>

        <section class="audio-panel panel" aria-labelledby="audio-heading">
            <header class="panel-header">
                <h2 id="audio-heading" tabindex="-1">Session audio</h2>
                <button type="button" class="panel-link" data-view-target="audio" aria-label="Open session audio">
                    <span aria-hidden="true">↗</span>
                </button>
            </header>
            <p id="audio-session" class="audio-session" hidden></p>
            <div id="player" class="player" hidden>
                <audio id="audio" preload="metadata"></audio>
                <button id="play" type="button" aria-label="Play" disabled>
                    <span aria-hidden="true"></span>
                </button>
                <time id="current-time">00:00</time>
                <input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="Playback position"
                    disabled>
                <time id="duration">00:00</time>
            </div>
            <p class="no-audio">Open a session to play its audio.</p>
        </section>
    </main>
</body>

</html>
