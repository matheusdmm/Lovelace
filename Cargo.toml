[package]
name = "lovelace"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
default-run = "lovelace"

[[bin]]
name = "lovelace-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:dunce", "dep:pulldown-cmark", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:window-vibrancy", "dep:windows-sys", "dep:windows-version"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15.3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
dunce = { version = "1", optional = true }
window-vibrancy = { version = "0.6", optional = true }
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }
windows-version = { version = "0.1", optional = true }

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true }
